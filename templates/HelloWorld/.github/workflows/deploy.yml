name: Deploy to Ketrics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "ketrics.config.json"

env:
  KETRICS_API_URL: https://api.ketrics.io/api/v1
  KETRICS_RUNTIME_URL: https://runtime.ketrics.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Install Ketrics CLI — ALWAYS pin the range.
      # Unpinned, npm walks back to 0.1.0 on any Node older than 24: that CLI
      # ships a ZIP with no ketrics.config.json and still reports success, so
      # the app silently keeps its old actions, roles and variables while CI
      # stays green. node-version 24 + this range + .npmrc engine-strict=true
      # are what prevent it. The parameter and connection resource kinds need
      # 0.14.0 or newer.
      - run: npm install -g @ketrics/ketrics-cli@^0.14
      - run: ketrics --version

      # Generate .env file (only KETRICS_TOKEN is a secret)
      - name: Generate .env file
        run: |
          cat <<EOF > .env
          KETRICS_API_URL=$KETRICS_API_URL
          KETRICS_RUNTIME_URL=$KETRICS_RUNTIME_URL
          KETRICS_TENANT_ID=${{ vars.KETRICS_TENANT_ID }}
          KETRICS_APPLICATION_ID=${{ vars.KETRICS_APPLICATION_ID }}
          KETRICS_TOKEN=${{ secrets.KETRICS_TOKEN }}
          EOF

      # Backend: install + build
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend

      # Frontend: install + build
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      # Deploy
      - run: ketrics deploy --env .env
